map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json;
    location /api/ {
        # Re-resolve through Docker DNS on every request: a plain hostname is resolved
        # once at start-up, so restarting the API container would 502 until nginx reloaded.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        access_log off;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location /vendor/ { expires 1d; }
    location / {
        add_header Cache-Control no-store;
        try_files $uri $uri/ /index.html;
    }
}