name: CI

# Здесь только то, что честно проходит на чистой машине за минуту: сборка,
# vet и модульные тесты. Полный конвейер (`test.ps1`) поднимает PostgreSQL,
# песочницы Docker и два настоящих PTY — его гоняют локально.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (Go)
    runs-on: ubuntu-latest
    # В контейнере, а не на голом раннере: тесты изоляции файловой системы
    # передают файлы непривилегированному uid оболочки через chown, а это
    # умеет только root. Локальный конвейер гоняет Go точно так же.
    container: golang:1.26
    steps:
      - uses: actions/checkout@v4
      # Каталог принадлежит другому uid, чем процесс в контейнере: git считает
      # его чужим и молчит, а go build не может проставить VCS-штамп и падает.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Vet
        working-directory: backend
        run: go vet ./internal/... ./cmd/...
      - name: Unit tests
        working-directory: backend
        run: go test -race -count=1 ./internal/...
      - name: Cross-build for both phone architectures
        working-directory: backend
        run: |
          GOOS=linux GOARCH=arm64 go build ./cmd/local
          GOOS=linux GOARCH=arm GOARM=7 go build ./cmd/local
          GOOS=linux GOARCH=amd64 go build ./cmd/api

  interface:
    name: Interface (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble the page
        run: python build.py
      - name: Compile the JSX
        run: |
          npm install --no-audit --no-fund --no-save @babel/standalone@7.28.5
          node -e "
            const fs = require('fs'), babel = require('@babel/standalone');
            for (const name of fs.readdirSync('src').filter(n => n.endsWith('.jsx'))) {
              babel.transform(fs.readFileSync('src/' + name, 'utf8'), { presets: ['react'] });
              console.log('JSX OK', name);
            }
          "
